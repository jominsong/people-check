<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<title>회식 차수 관리</title>
<style>
:root{--bg:#fff;--bg2:#f4f4f2;--bg3:#e9e9e7;--text:#111;--text2:#888;--bd:rgba(0,0,0,0.09);--bd2:rgba(0,0,0,0.16);--c1:#378ADD;--c2:#1D9E75;--c3:#D4537E;--c4:#BA7517;--r:10px;--bh:64px;}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--text:#f2f2f7;--text2:#8e8e93;--bd:rgba(255,255,255,0.08);--bd2:rgba(255,255,255,0.16);}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
.spin{width:36px;height:36px;border:3px solid var(--bd2);border-top-color:var(--c1);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loading p{font-size:14px;color:var(--text2);}
#modeSelect{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:14px;z-index:50;}
.mode-title{font-size:22px;font-weight:700;margin-bottom:4px;text-align:center;}
.mode-sub{font-size:14px;color:var(--text2);text-align:center;margin-bottom:8px;line-height:1.6;}
.mode-btn{width:100%;max-width:360px;padding:18px;border-radius:16px;border:1.5px solid var(--bd2);background:var(--bg2);cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;}
.mode-btn:active{background:var(--bg3);}
.mode-icon{font-size:28px;}
.mode-name{font-size:15px;font-weight:600;display:block;}
.mode-desc{font-size:12px;color:var(--text2);display:block;margin-top:2px;}
#memberView{display:none;min-height:100vh;}
.mv-top{background:var(--bg);padding:20px 16px 14px;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10;}
.mv-title{font-size:17px;font-weight:700;margin-bottom:3px;}
.mv-sub{font-size:12px;color:var(--text2);margin-bottom:10px;}
.mv-si{width:100%;padding:10px 13px;border:1px solid var(--bd2);border-radius:10px;font-size:16px;background:var(--bg2);color:var(--text);}
.mv-si:focus{outline:none;border-color:var(--c1);}
.mv-list{padding:10px 14px 40px;}
.mv-card{border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);margin-bottom:6px;overflow:hidden;}
.mv-ch{display:flex;align-items:center;padding:14px 13px;cursor:pointer;gap:8px;}
.mv-ch:active{background:var(--bg2);}
.mv-nm{font-size:16px;font-weight:500;flex:1;}
.mv-ks{font-size:10px;color:var(--text2);background:var(--bg2);padding:2px 6px;border-radius:4px;}
.mv-ps{display:flex;gap:3px;}
.p{font-size:10px;padding:3px 6px;border-radius:4px;background:var(--bg3);color:var(--text2);}
.p.a1{background:var(--c1);color:#fff;}.p.a2{background:var(--c2);color:#fff;}.p.a3{background:var(--c3);color:#fff;}.p.a4{background:var(--c4);color:#fff;}
.mv-rp{display:flex;gap:6px;padding:10px 13px;background:var(--bg2);}
.mv-rb{flex:1;padding:14px 0;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg);color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;text-align:center;}
.mv-rb.on1{background:var(--c1);border-color:var(--c1);color:#fff;}
.mv-rb.on2{background:var(--c2);border-color:var(--c2);color:#fff;}
.mv-rb.on3{background:var(--c3);border-color:var(--c3);color:#fff;}
.mv-rb.on4{background:var(--c4);border-color:var(--c4);color:#fff;}
.mv-done{display:flex;align-items:center;gap:6px;padding:9px 13px;background:#f0faf4;border-top:1px solid var(--bd);}
.mv-done svg{width:16px;height:16px;stroke:#1D9E75;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.mv-done span{font-size:13px;color:#1D9E75;font-weight:500;}
#adminView{display:none;}
#top{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--bd);}
.hdr{padding:12px 14px 0;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.title{font-size:16px;font-weight:700;}
.sub{font-size:10px;color:var(--text2);}
.conn-row{display:flex;align-items:center;gap:5px;}
.conn-dot{width:7px;height:7px;border-radius:50%;background:#ccc;}
.conn-dot.on{background:#4CAF50;}
.conn-lbl{font-size:10px;color:var(--text2);}
.si{width:100%;padding:9px 13px;border:1px solid var(--bd2);border-radius:10px;font-size:16px;background:var(--bg2);color:var(--text);margin-bottom:8px;}
.si:focus{outline:none;border-color:var(--c1);}
.sort-row{display:flex;align-items:center;justify-content:space-between;padding-bottom:9px;}
.tabs{display:flex;gap:4px;}
.tab{padding:5px 10px;border-radius:18px;font-size:11px;font-weight:500;border:1px solid var(--bd2);background:var(--bg);color:var(--text2);cursor:pointer;}
.tab.on{background:var(--text);color:var(--bg);border-color:transparent;}
.cnt{font-size:11px;color:var(--text2);}
.leg{display:flex;gap:10px;padding:5px 14px 8px;border-top:1px solid var(--bd);}
.li{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);}
.ld{width:7px;height:7px;border-radius:50%;}
#list{padding:8px 14px;padding-bottom:calc(var(--bh)+16px);}
#shareBanner{background:var(--bg2);border:1px solid var(--bd2);border-radius:var(--r);margin:8px 14px 0;padding:12px 14px;display:none;}
.sb-title{font-size:12px;font-weight:600;margin-bottom:5px;}
.sb-url{font-size:11px;color:var(--c1);word-break:break-all;margin-bottom:8px;}
.sb-btns{display:flex;gap:6px;}
.sb-btn{flex:1;padding:9px;border-radius:8px;border:1px solid var(--bd2);background:var(--bg);font-size:12px;font-weight:500;cursor:pointer;text-align:center;}
.card{border:1px solid var(--bd);border-radius:var(--r);background:var(--bg);margin-bottom:6px;overflow:hidden;}
.ch{display:flex;align-items:center;padding:12px 12px;cursor:pointer;gap:8px;}
.ch:active{background:var(--bg2);}
.ch-l{display:flex;align-items:center;gap:7px;flex:1;min-width:0;}
.nm{font-size:15px;font-weight:500;}
.ks{font-size:10px;color:var(--text2);background:var(--bg2);padding:2px 6px;border-radius:4px;flex-shrink:0;}
.ch-r{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.ps{display:flex;gap:3px;}
.dx{width:22px;height:22px;border-radius:50%;border:none;background:var(--bg3);color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.rp{display:flex;gap:6px;padding:9px 12px;background:var(--bg2);}
.rb{flex:1;padding:12px 0;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg);color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;text-align:center;}
.rb.o1{background:var(--c1);border-color:var(--c1);color:#fff;}.rb.o2{background:var(--c2);border-color:var(--c2);color:#fff;}.rb.o3{background:var(--c3);border-color:var(--c3);color:#fff;}.rb.o4{background:var(--c4);border-color:var(--c4);color:#fff;}
#bar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--bg);border-top:1px solid var(--bd);display:flex;height:var(--bh);padding-bottom:env(safe-area-inset-bottom,0px);}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:none;color:var(--text2);font-size:10px;font-weight:500;padding:8px 0;}
.tb:active{background:var(--bg2);}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.tb.acc{color:var(--c1);}.tb.acc svg{stroke:var(--c1);}
input[type=file]{display:none;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sh{background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px));width:100%;max-height:90vh;overflow-y:auto;}
.handle{width:36px;height:4px;border-radius:2px;background:var(--bd2);margin:0 auto 14px;}
.sh-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sh-tt{font-size:17px;font-weight:600;}
.sh-cl{width:30px;height:30px;border-radius:50%;border:none;background:var(--bg2);color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sec-lbl{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.04em;margin-bottom:9px;}
.csv-btn{width:100%;padding:14px;border-radius:var(--r);border:1.5px dashed var(--bd2);background:var(--bg2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;}
.csv-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.add-fields{display:flex;gap:7px;margin-bottom:6px;}
.ai{flex:1;padding:12px 13px;border:1px solid var(--bd2);border-radius:10px;font-size:16px;background:var(--bg2);color:var(--text);}
.ai:focus{outline:none;border-color:var(--c1);}
.ai.short{max-width:85px;flex:none;}
.add-ok{padding:12px 15px;border-radius:10px;border:none;background:var(--text);color:var(--bg);font-size:15px;font-weight:600;cursor:pointer;}
.hint{font-size:11px;color:var(--text2);margin-bottom:14px;}
.ml-lbl{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.04em;margin-bottom:8px;}
.mlist{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow-y:auto;}
.mi{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg2);border-radius:var(--r);}
.mi-nm{font-size:14px;font-weight:500;}
.mi-k{font-size:11px;color:var(--text2);margin-left:5px;}
.mi-del{width:26px;height:26px;border-radius:50%;border:none;background:var(--bg3);color:var(--text2);font-size:15px;cursor:pointer;}
.mgmt-btn{width:100%;padding:15px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.mgmt-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.mgmt-btn.red{color:#E24B4A;}
.sc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;}
.sc{background:var(--bg2);border-radius:var(--r);padding:13px 12px;display:flex;align-items:center;gap:10px;}
.sc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.sc-lbl{font-size:13px;font-weight:500;flex:1;}
.sc-num{font-size:26px;font-weight:700;line-height:1;}
.sc-unit{font-size:12px;font-weight:500;}
.s1{color:var(--c1);}.s2{color:var(--c2);}.s3{color:var(--c3);}.s4{color:var(--c4);}
.se-tt{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.04em;margin-bottom:8px;}
.rs{background:var(--bg2);border-radius:var(--r);padding:10px 12px;margin-bottom:7px;}
.rl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;margin-bottom:7px;}
.rdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.nt{display:flex;flex-wrap:wrap;gap:5px;}
.ntg{font-size:12px;padding:3px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--bd);}
.dv{border:none;border-top:1px solid var(--bd);margin:14px 0;}
.pre{font-size:12px;line-height:1.9;white-space:pre-wrap;background:var(--bg2);padding:12px;border-radius:var(--r);font-family:monospace;margin-bottom:10px;}
.ar{display:flex;gap:7px;margin-bottom:10px;}
.ab{flex:1;padding:13px;border-radius:var(--r);border:1px solid var(--bd2);background:var(--bg);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;text-align:center;}
.rta{width:100%;height:120px;padding:10px;border-radius:10px;border:1px solid var(--bd2);background:var(--bg2);color:var(--text);font-family:monospace;font-size:11px;line-height:1.8;resize:none;}
.cf-body{text-align:center;padding:10px 0 20px;}
.cf-ico{font-size:38px;margin-bottom:12px;}
.cf-tt{font-size:17px;font-weight:600;margin-bottom:8px;}
.cf-desc{font-size:14px;color:var(--text2);line-height:1.6;}
.empty-state{text-align:center;padding:4rem 1.5rem;}
.empty-ico{font-size:42px;margin-bottom:12px;}
.empty-msg{font-size:14px;color:var(--text2);line-height:1.8;}
.toast{position:fixed;bottom:calc(var(--bh)+10px);left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.92);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:400;white-space:nowrap;}
.toast.on{opacity:1;}
.mv-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.92);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:400;white-space:nowrap;}
.mv-toast.on{opacity:1;}
</style>
</head>
<body>

<div id="loading"><div class="spin"></div><p>연결 중...</p></div>

<div id="modeSelect" style="display:none">
  <div class="mode-title">🍻 회식 차수 관리</div>
  <div class="mode-sub">역할을 선택해주세요</div>
  <button class="mode-btn" onclick="enterAdmin()">
    <span class="mode-icon">👑</span>
    <div><span class="mode-name">총무 (관리자)</span><span class="mode-desc">명단 관리, 정산, 현황 확인</span></div>
  </button>
  <button class="mode-btn" onclick="enterMember()">
    <span class="mode-icon">🙋</span>
    <div><span class="mode-name">참여자</span><span class="mode-desc">내 이름 찾아서 차수 체크</span></div>
  </button>
</div>

<div id="memberView">
  <div class="mv-top">
    <div class="mv-title">🍻 회식 차수 체크</div>
    <div class="mv-sub">내 이름을 찾아 참여한 차수를 눌러주세요</div>
    <input class="mv-si" type="text" id="mvSi" placeholder="이름으로 검색...">
  </div>
  <div class="mv-list" id="mvList"></div>
  <div class="mv-toast" id="mvToast"></div>
</div>

<div id="adminView">
  <div id="top">
    <div class="hdr">
      <div class="hdr-row">
        <div><div class="title">회식 차수 관리</div><div class="sub" id="appSub">명단 없음</div></div>
        <div class="conn-row"><div class="conn-dot" id="connDot"></div><span class="conn-lbl" id="connLbl">연결 중</span></div>
      </div>
      <input class="si" type="text" id="si" placeholder="이름 또는 기수 검색...">
      <div class="sort-row">
        <div class="tabs">
          <button class="tab on" id="t0" onclick="setSort(0)">기수순</button>
          <button class="tab"    id="t1" onclick="setSort(1)">가나다순</button>
          <button class="tab"    id="t2" onclick="setSort(2)">참여순</button>
        </div>
        <span class="cnt" id="cnt"></span>
      </div>
    </div>
    <div class="leg">
      <div class="li"><div class="ld" style="background:var(--c1)"></div>1차</div>
      <div class="li"><div class="ld" style="background:var(--c2)"></div>2차</div>
      <div class="li"><div class="ld" style="background:var(--c3)"></div>3차</div>
      <div class="li"><div class="ld" style="background:var(--c4)"></div>4차</div>
    </div>
  </div>
  <div id="shareBanner">
    <div class="sb-title">📤 참여자 링크 공유</div>
    <div class="sb-url" id="shareUrl"></div>
    <div class="sb-btns">
      <button class="sb-btn" onclick="copyLink()">링크 복사</button>
      <button class="sb-btn" onclick="shareLink()">공유하기</button>
      <button class="sb-btn" onclick="closeBanner()">닫기</button>
    </div>
  </div>
  <div id="list"></div>
  <div id="bar">
    <button class="tb" onclick="openAdd()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>추가</button>
    <button class="tb" onclick="openShare()"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>공유</button>
    <button class="tb" onclick="openMgmt()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>관리</button>
    <button class="tb acc" onclick="openSettle()"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>정산</button>
  </div>
</div>

<input type="file" id="csvFile" accept=".csv" onchange="handleCSV(this)">

<div class="ov" id="ovAdd" style="display:none" onclick="closeAdd()">
  <div class="sh" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="sh-hd"><span class="sh-tt">멤버 추가</span><button class="sh-cl" onclick="closeAdd()">×</button></div>
    <div class="sec-lbl">CSV 파일로 불러오기</div>
    <label class="csv-btn" for="csvFile" onclick="closeAdd()"><svg viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>CSV 파일 선택</label>
    <div class="sec-lbl">직접 입력</div>
    <div class="add-fields">
      <input class="ai" type="text" id="addName" placeholder="이름" maxlength="6" autocomplete="off">
      <input class="ai short" type="text" id="addKisu" placeholder="기수" maxlength="5" autocomplete="off">
      <button class="add-ok" onclick="doAdd()">추가</button>
    </div>
    <div class="hint">Enter 키로도 추가 가능</div>
    <div class="ml-lbl">현재 명단 (<span id="mlCnt">0</span>명)</div>
    <div class="mlist" id="mlist"></div>
  </div>
</div>

<div class="ov" id="ovMgmt" style="display:none" onclick="closeMgmt()">
  <div class="sh" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="sh-hd"><span class="sh-tt">관리</span><button class="sh-cl" onclick="closeMgmt()">×</button></div>
    <button class="mgmt-btn" onclick="closeMgmt();openConfirm()"><svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>참여 기록 초기화</button>
    <button class="mgmt-btn red" onclick="closeMgmt();openClearConfirm()"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>명단 전체 비우기</button>
  </div>
</div>

<div class="ov" id="ovSettle" style="display:none" onclick="closeSettle()">
  <div class="sh" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="sh-hd"><span class="sh-tt">정산 결과</span><button class="sh-cl" onclick="closeSettle()">×</button></div>
    <div id="settleBody"></div>
  </div>
</div>

<div class="ov" id="ovConfirm" style="display:none" onclick="closeConfirm()">
  <div class="sh" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="cf-body"><div class="cf-ico">🔄</div><div class="cf-tt">참여 기록 초기화</div><div class="cf-desc">모든 차수 체크가 지워집니다.<br>명단은 유지됩니다.</div></div>
    <div class="ar"><button class="ab" onclick="closeConfirm()">취소</button><button class="ab" style="color:#E24B4A;font-weight:600" onclick="doReset()">초기화</button></div>
  </div>
</div>

<div class="ov" id="ovClear" style="display:none" onclick="closeClearConfirm()">
  <div class="sh" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <div class="cf-body"><div class="cf-ico">🗑️</div><div class="cf-tt">명단 전체 비우기</div><div class="cf-desc">명단과 모든 기록이<br>완전히 삭제됩니다.</div></div>
    <div class="ar"><button class="ab" onclick="closeClearConfirm()">취소</button><button class="ab" style="color:#E24B4A;font-weight:600" onclick="doClearMembers()">전체 삭제</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,set,onValue}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FB={apiKey:"AIzaSyDWSsRwvY5XRW9hfg2PLBVCc0yUsTGLu60",authDomain:"people-check-7ea0b.firebaseapp.com",databaseURL:"https://people-check-7ea0b-default-rtdb.firebaseio.com",projectId:"people-check-7ea0b",storageBucket:"people-check-7ea0b.firebasestorage.app",messagingSenderId:"962916207256",appId:"1:962916207256:web:6df85d426e010831715eed"};
const app=initializeApp(FB);
const db=getDatabase(app);

const R=["1차","2차","3차","4차"];
const PC=["a1","a2","a3","a4"];
const RC=["o1","o2","o3","o4"];
const RD=["var(--c1)","var(--c2)","var(--c3)","var(--c4)"];
const SC=["s1","s2","s3","s4"];

let members=[],att={},exp=null,sort=0,nid=1,isAdmin=false,mvExp=null;

function setConn(ok){
  const d=document.getElementById("connDot"),l=document.getElementById("connLbl");
  if(d)d.className="conn-dot"+(ok?" on":"");
  if(l)l.textContent=ok?"실시간 연결":"연결 끊김";
}

function listenDB(){
  onValue(ref(db,"members"),snap=>{
    members=snap.val()?Object.values(snap.val()):[];
    nid=members.length?Math.max(...members.map(m=>m.id))+1:1;
    setConn(true);
    if(isAdmin)render();else renderMv();
  },()=>setConn(false));
  onValue(ref(db,"att"),snap=>{
    const raw=snap.val()||{};
    att={};
    for(const id in raw)att[id]=new Set(raw[id]);
    if(isAdmin)render();else renderMv();
  });
}

async function saveMembers(){const o={};members.forEach(m=>{o[m.id]=m;});await set(ref(db,"members"),o);}
async function saveAtt(){const o={};for(const id in att){if(att[id]&&att[id].size>0)o[id]=Array.from(att[id]);}await set(ref(db,"att"),Object.keys(o).length?o:null);}

window.enterAdmin=function(){isAdmin=true;document.getElementById("modeSelect").style.display="none";document.getElementById("adminView").style.display="block";setTop();render();};
window.enterMember=function(){isAdmin=false;document.getElementById("modeSelect").style.display="none";document.getElementById("memberView").style.display="block";renderMv();};

function renderMv(){
  const q=(document.getElementById("mvSi")?.value||"").trim();
  const list=[...members].filter(m=>m.name.includes(q)||m.k.includes(q)).sort((a,b)=>{const an=parseInt(a.k)||0,bn=parseInt(b.k)||0;return an!==bn?an-bn:a.name.localeCompare(b.name,"ko");});
  if(!list.length){document.getElementById("mvList").innerHTML="<div class='empty-state'><div class='empty-ico'>📋</div><div class='empty-msg'>명단이 없거나<br>검색 결과가 없습니다</div></div>";return;}
  let html="";
  for(const m of list){
    const a=att[m.id]||new Set();
    const pills=R.map((r,ri)=>`<span class='p ${a.has(r)?PC[ri]:""}'>${r}</span>`).join("");
    html+=`<div class='mv-card'><div class='mv-ch' onclick='mvToggle(${m.id})'><span class='mv-nm'>${m.name}</span>${m.k?`<span class='mv-ks'>${m.k}</span>`:""}<div class='mv-ps'>${pills}</div></div>`;
    if(mvExp===m.id){
      html+=`<div class='mv-rp'>${R.map((r,ri)=>`<button class='mv-rb ${a.has(r)?"on"+(ri+1):""}' onclick='mvRound(${m.id},${ri})'>${r}</button>`).join("")}</div>`;
      if(a.size>0)html+=`<div class='mv-done'><svg viewBox='0 0 24 24'><polyline points='20 6 9 17 4 12'/></svg><span>체크 완료! 고마워요 😊</span></div>`;
    }
    html+=`</div>`;
  }
  document.getElementById("mvList").innerHTML=html;
}
window.mvToggle=function(id){mvExp=mvExp===id?null:id;renderMv();};
window.mvRound=async function(id,ri){
  if(!att[id])att[id]=new Set();
  att[id].has(R[ri])?att[id].delete(R[ri]):att[id].add(R[ri]);
  renderMv();await saveAtt();
  showMvToast(att[id].has(R[ri])?`${R[ri]} 체크됐습니다`:`${R[ri]} 해제됐습니다`);
};
function showMvToast(msg){const t=document.getElementById("mvToast");t.textContent=msg;t.className="mv-toast on";setTimeout(()=>t.className="mv-toast",2000);}

function setTop(){document.getElementById("list").style.paddingTop=(document.getElementById("top").offsetHeight+8)+"px";}
window.setSort=function(n){sort=n;for(let i=0;i<3;i++)document.getElementById("t"+i).className="tab"+(i===n?" on":"");render();};
function getSorted(list){const c=[...list];if(sort===1)return c.sort((a,b)=>a.name.localeCompare(b.name,"ko"));if(sort===2)return c.sort((a,b)=>(att[b.id]?.size||0)-(att[a.id]?.size||0));return c.sort((a,b)=>{const an=parseInt(a.k)||0,bn=parseInt(b.k)||0;return an!==bn?an-bn:a.name.localeCompare(b.name,"ko");});}

function render(){
  if(!isAdmin)return;
  const q=(document.getElementById("si")?.value||"").trim();
  const filtered=getSorted(members.filter(m=>m.name.includes(q)||m.k.includes(q)));
  const attended=members.filter(m=>att[m.id]?.size>0).length;
  document.getElementById("appSub").textContent=`총 ${members.length}명 · 참여 ${attended}명`;
  document.getElementById("cnt").textContent=`${filtered.length}명`;
  if(!members.length){document.getElementById("list").innerHTML="<div class='empty-state'><div class='empty-ico'>📋</div><div class='empty-msg'>명단이 없습니다<br><b>추가</b> 버튼으로 멤버를 추가하세요</div></div>";setTop();return;}
  if(!filtered.length){document.getElementById("list").innerHTML="<div class='empty-state'><div class='empty-msg'>검색 결과 없음</div></div>";setTop();return;}
  let html="";
  for(const m of filtered){
    const a=att[m.id]||new Set();
    const pills=R.map((r,ri)=>`<span class='p ${a.has(r)?PC[ri]:""}'>${r}</span>`).join("");
    html+=`<div class='card'><div class='ch' onclick='toggleExp(${m.id})'><div class='ch-l'><span class='nm'>${m.name}</span>${m.k?`<span class='ks'>${m.k}</span>`:""}</div><div class='ch-r'><div class='ps'>${pills}</div><button class='dx' onclick='event.stopPropagation();delMember(${m.id},"${m.name}")'>×</button></div></div>`;
    if(exp===m.id){html+=`<div class='rp'>${R.map((r,ri)=>`<button class='rb ${a.has(r)?RC[ri]:""}' onclick='event.stopPropagation();toggleRound(${m.id},${ri})'>${r}</button>`).join("")}</div>`;}
    html+=`</div>`;
  }
  document.getElementById("list").innerHTML=html;
  setTop();
}
window.toggleExp=function(id){exp=exp===id?null:id;render();};
window.toggleRound=async function(id,ri){if(!att[id])att[id]=new Set();att[id].has(R[ri])?att[id].delete(R[ri]):att[id].add(R[ri]);render();await saveAtt();};
window.delMember=async function(id,name){if(!confirm(`${name}을(를) 삭제할까요?`))return;members=members.filter(m=>m.id!==id);delete att[id];if(exp===id)exp=null;await saveMembers();await saveAtt();showToast(`${name} 삭제됐습니다`);};

window.handleCSV=async function(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async function(e){
    try{
      const raw=e.target.result.replace(/\ufeff/g,"");
      const cleaned=raw.replace(/"[^"]*"/g,m=>m.replace(/\r?\n/g," "));
      const rows=cleaned.split(/\r?\n/).map(r=>r.split(","));
      let nc=-1,kc=-1;
      for(let i=0;i<rows.length;i++){for(let j=0;j<rows[i].length;j++){if(rows[i][j].trim()==="이름"){nc=j;kc=j-1;break;}}if(nc!==-1)break;}
      if(nc===-1){for(let i=0;i<rows.length;i++){if(rows[i][1]?.trim()==="기수"&&rows[i][2]?.trim()==="이름"){kc=1;nc=2;break;}}}
      if(nc===-1){showToast("이름 열을 찾지 못했습니다");return;}
      const skip=["이름","기수","인원수","비고","참고","기수는","만약","입금","UPSC","오류","파일"];
      const parsed=[];let id=1;
      for(const row of rows){
        const name=(row[nc]||"").trim(),kisu=kc>=0?(row[kc]||"").trim():"";
        if(!name||name.length<2||name.length>6)continue;
        if(/^\d/.test(name))continue;
        if(skip.some(s=>name.includes(s)))continue;
        if(!/^[가-힣]{2,5}$/.test(name))continue;
        const km=kisu.match(/\d+기/);
        parsed.push({id:id++,name,k:km?km[0]:""});
      }
      if(!parsed.length){showToast("유효한 이름을 찾지 못했습니다");return;}
      members=parsed;att={};exp=null;nid=parsed.length+1;
      await saveMembers();await saveAtt();
      showToast(`${parsed.length}명 불러왔습니다`);renderMlist();
    }catch(err){showToast("파일 오류: "+err.message);}
  };
  rd.readAsText(f,"utf-8");inp.value="";
};

window.openAdd=function(){renderMlist();document.getElementById("ovAdd").style.display="flex";setTimeout(()=>document.getElementById("addName").focus(),300);};
window.closeAdd=function(){document.getElementById("ovAdd").style.display="none";};
window.doAdd=async function(){
  const name=(document.getElementById("addName").value||"").trim();
  const kisu=(document.getElementById("addKisu").value||"").trim();
  if(!name){showToast("이름을 입력해주세요");return;}
  if(name.length<2){showToast("이름이 너무 짧습니다");return;}
  if(members.some(m=>m.name===name)){showToast("이미 있는 이름입니다");return;}
  const km=kisu.match(/\d+기/);
  members.push({id:nid++,name,k:km?km[0]:kisu});
  await saveMembers();
  document.getElementById("addName").value="";document.getElementById("addKisu").value="";
  document.getElementById("addName").focus();
  renderMlist();showToast(`${name} 추가됐습니다`);
};
window.delFromList=async function(id){const m=members.find(x=>x.id===id);if(!m)return;members=members.filter(x=>x.id!==id);delete att[id];await saveMembers();await saveAtt();renderMlist();showToast(`${m.name} 삭제됐습니다`);};
function renderMlist(){
  const list=getSorted([...members]);
  document.getElementById("mlCnt").textContent=list.length;
  if(!list.length){document.getElementById("mlist").innerHTML="<div style='text-align:center;padding:1.2rem;color:var(--text2);font-size:13px'>추가된 멤버가 없습니다</div>";return;}
  document.getElementById("mlist").innerHTML=list.map(m=>`<div class='mi'><div><span class='mi-nm'>${m.name}</span><span class='mi-k'>${m.k}</span></div><button class='mi-del' onclick='delFromList(${m.id})'>×</button></div>`).join("");
}

window.openShare=function(){document.getElementById("shareUrl").textContent=location.href;const b=document.getElementById("shareBanner");b.style.display=b.style.display==="none"?"block":"none";setTop();};
window.closeBanner=function(){document.getElementById("shareBanner").style.display="none";setTop();};
window.copyLink=function(){navigator.clipboard?.writeText(location.href).then(()=>showToast("링크 복사됐습니다")).catch(()=>showToast("복사 실패"));};
window.shareLink=function(){if(navigator.share)navigator.share({title:"회식 차수 체크",url:location.href}).catch(()=>{});else window.copyLink();};

window.openMgmt=function(){document.getElementById("ovMgmt").style.display="flex";};
window.closeMgmt=function(){document.getElementById("ovMgmt").style.display="none";};
window.openConfirm=function(){document.getElementById("ovConfirm").style.display="flex";};
window.closeConfirm=function(){document.getElementById("ovConfirm").style.display="none";};
window.doReset=async function(){att={};exp=null;await set(ref(db,"att"),null);closeConfirm();render();showToast("기록이 초기화됐습니다");};
window.openClearConfirm=function(){document.getElementById("ovClear").style.display="flex";};
window.closeClearConfirm=function(){document.getElementById("ovClear").style.display="none";};
window.doClearMembers=async function(){members=[];att={};exp=null;nid=1;await set(ref(db,"members"),null);await set(ref(db,"att"),null);closeClearConfirm();render();showToast("명단이 비워졌습니다");};

window.openSettle=function(){
  if(!members.length){showToast("명단이 없습니다");return;}
  const rc=R.map(r=>members.filter(m=>att[m.id]?.has(r)));
  const cards=`<div class='sc-grid'>${R.map((r,i)=>`<div class='sc'><div class='sc-dot' style='background:${RD[i]}'></div><div class='sc-lbl'>${r}</div><div class='sc-num ${SC[i]}'>${rc[i].length}<span class='sc-unit'>명</span></div></div>`).join("")}</div>`;
  const secs=R.map((r,i)=>{const who=rc[i];const tags=who.length?who.map(m=>`<span class='ntg'>${m.name}</span>`).join(""):"<span style='font-size:12px;color:var(--text2)'>참여 없음</span>";return`<div class='rs'><div class='rl'><div class='rdot' style='background:${RD[i]}'></div>${r} · ${who.length}명</div><div class='nt'>${tags}</div></div>`;}).join("");
  const txt=buildText();const pre=txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  document.getElementById("settleBody").innerHTML=cards+`<div class='se-tt'>차수별 명단</div>`+secs+`<hr class='dv'><div class='se-tt' style='margin-bottom:8px'>텍스트 정산표</div><div class='pre'>${pre}</div><div class='ar'><button class='ab' onclick='doCopy()'>클립보드 복사</button><button class='ab' onclick='doShare2()'>공유하기</button></div><div style='font-size:11px;color:var(--text2);margin-bottom:6px'>👆 아래 눌러서 전체 선택 후 복사</div><textarea class='rta' readonly onclick='this.select()' id='rta'></textarea>`;
  document.getElementById("ovSettle").style.display="flex";
  setTimeout(()=>{const t=document.getElementById("rta");if(t)t.value=txt;},50);
};
window.closeSettle=function(){document.getElementById("ovSettle").style.display="none";};
function buildText(){
  const date=new Date().toLocaleDateString("ko-KR");
  const lines=[`UPSC 회식 정산 · ${date}`,"","[ 차수별 참여 인원 ]"];
  R.forEach((r)=>{const who=members.filter(m=>att[m.id]?.has(r));lines.push(`${r} : ${who.length}명`+(who.length?` (${who.map(m=>m.name).join(", ")})`:""));});
  lines.push("","─────────────","[ 개인별 참여 차수 ]");
  const ap=members.filter(m=>att[m.id]?.size>0);
  if(ap.length)ap.forEach(m=>{const rs=R.filter(r=>att[m.id].has(r));lines.push(`${m.name}${m.k?"("+m.k+")":""}: ${rs.join(", ")}`);});
  else lines.push("참여 기록 없음");
  return lines.join("\n");
}
window.doCopy=function(){const txt=buildText();if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>showToast("복사됐습니다")).catch(()=>fallback(txt));else fallback(txt);};
window.doShare2=function(){if(navigator.share)navigator.share({title:"회식 정산",text:buildText()}).catch(()=>{});else window.doCopy();};
function fallback(txt){const ta=document.createElement("textarea");ta.value=txt;ta.style.cssText="position:fixed;opacity:0;top:0;left:0;";document.body.appendChild(ta);ta.focus();ta.select();document.execCommand("copy");document.body.removeChild(ta);showToast("복사됐습니다");}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.className="toast on";setTimeout(()=>t.className="toast",2200);}

document.getElementById("si")?.addEventListener("input",()=>render());
document.getElementById("mvSi")?.addEventListener("input",()=>renderMv());
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&document.getElementById("ovAdd").style.display==="flex")window.doAdd();});

listenDB();
setTimeout(()=>{document.getElementById("loading").style.display="none";document.getElementById("modeSelect").style.display="flex";},1500);
</script>
</body>
</html>
